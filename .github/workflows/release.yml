name: Release

# On every push to main, release-please opens or updates a release PR that bumps the
# version (package.json and public/manifest.json) and the changelog from the conventional
# commits since the last release. Merging that PR tags it and creates the GitHub Release;
# the extension zip is then built and attached to it for upload to the Chrome Web Store.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger other workflows, so CI
          # would never run on the release PR. A fine-grained PAT (or GitHub App token)
          # with Contents and Pull requests read/write on this repo fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-zip:
    name: Attach extension zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build and package
        run: npm run package

      - name: Upload zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" release/*.zip
